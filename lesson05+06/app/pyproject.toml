[project]
name = "my-fastapi-app"
version = "0.1.0"
description = "FastAPI production app"
authors = [
    {name = "truongtamthanh2004", email = "truongtamthanh2004@gmail.com"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi (>=0.115.0,<0.116.0)",
    "uvicorn[standard] (>=0.32.0,<0.33.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
